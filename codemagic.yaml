workflows:
  ios-testflight:
    name: iOS — build and upload to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the "App Store Connect" integration you create under
      # Codemagic → Teams → Integrations → Apple Developer Portal.
      # Must match exactly, including capitalization.
      app_store_connect: "Codemagic"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: se.foraldrahjalpen.app
      groups:
        # Codemagic → your app → Environment variables → create a group
        # named "firebase_web" (or change the name below) holding any
        # VITE_*/build-time secrets this project needs. Leave empty/remove
        # this block if the web build has no required secrets beyond what's
        # already committed in firebase-applet-config.json.
        - firebase_web
      vars:
        BUNDLE_ID: "se.foraldrahjalpen.app"
        APP_STORE_APP_ID: "6798874532"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.19.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "master"
          include: true
      tag_patterns:
        - pattern: "ios-*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci

      - name: Type-check app
        script: npm run lint

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor iOS platform
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up automatic code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number to match App Store Connect
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID")
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))

      - name: Build .ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO PROVISIONING_PROFILE_SPECIFIER=foraldrahjalpen_appstore_profile_apple" || {
              echo "xcode-project build-ipa failed. Printing Xcode logs:"
              find /tmp/xcodebuild_logs -type f -name "*.log" -maxdepth 2 -print -exec cat {} \;
              exit 1
            }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        # Uses the integration named under "integrations" above —
        # no need to repeat the name here.
        auth: integration
        # Automatically send every successful iOS build all the way to TestFlight.
        submit_to_testflight: true
        # Flip to true only once you're ready for Apple to auto-review
        # every build; keep false while you're still iterating.
        submit_to_app_store: false
      email:
        recipients:
          - nomarcus@hotmail.com
        notify:
          success: true
          failure: true
