workflows:
  ios-testflight:
    name: iOS — build and upload to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the "App Store Connect" integration you create under
      # Codemagic → Teams → Integrations → Apple Developer Portal.
      # Must match exactly, including capitalization.
      app_store_connect: foraldrahjalpen_appstore
    environment:
      groups:
        # Codemagic → your app → Environment variables → create a group
        # named "firebase_web" (or change the name below) holding any
        # VITE_*/build-time secrets this project needs. Leave empty/remove
        # this block if the web build has no required secrets beyond what's
        # already committed in firebase-applet-config.json.
        - firebase_web
      vars:
        BUNDLE_ID: "se.foraldrahjalpen.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.11.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor iOS platform
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up automatic code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number to match App Store Connect
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))

      - name: Build .ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Same integration name as above.
        integration: foraldrahjalpen_appstore
        submit_to_testflight: true
        # Flip to true only once you're ready for Apple to auto-review
        # every build; keep false while you're still iterating.
        submit_to_app_store: false
      email:
        recipients:
          # Replace with the email you want build notifications sent to.
          - your-email@example.com
        notify:
          success: true
          failure: true
