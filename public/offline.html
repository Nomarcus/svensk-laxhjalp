<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Föräldrahjälpen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #F5F5F0; color: #1c1917; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .container { text-align: center; max-width: 400px; }
    .icon { width: 80px; height: 80px; background: #d1fae5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem; }
    h1 { font-size: 1.5rem; font-style: italic; margin-bottom: 0.5rem; }
    p { color: #78716c; font-size: 0.9rem; line-height: 1.6; }
    button { margin-top: 1.5rem; padding: 0.75rem 2rem; background: #059669; color: white; border: none; border-radius: 1rem; font-size: 0.9rem; cursor: pointer; }
    button:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📚</div>
    <h1>Du är offline</h1>
    <p>Föräldrahjälpen behöver internetanslutning för att fungera. Kontrollera din anslutning och försök igen.</p>
    <button onclick="location.reload()">Försök igen</button>
  </div>
</body>
</html>
