      <div>
        <h1>Föräldrahjälpen — AI-driven läxhjälp för svenska föräldrar</h1>
        <p>Föräldrahjälpen är en gratis AI-driven app som hjälper svenska föräldrar med barn i grundskolan (åk 1-9) att förstå och förklara läxor. Fota läxan med mobilen och få pedagogiska förklaringar kopplade till den svenska läroplanen Lgr22.</p>

        <h2>Hur fungerar AI-läxhjälpen?</h2>
        <p>Skriv en fråga eller fota en läxa — AI:n förklarar uppgiften steg för steg, anpassat efter barnets årskurs. Alla förklaringar kopplas till Lgr22 så du som förälder förstår varför barnet lär sig just detta.</p>

        <h2>Vilka funktioner ingår?</h2>
        <ul>
          <li>AI-assistent som förklarar alla skolämnen pedagogiskt</li>
          <li>Fota läxan med mobilen och få den analyserad</li>
          <li>Veckoplanering med kalender, deadlines och arbetsdagar</li>
          <li>Dela läxplaneringen mellan föräldrar</li>
          <li>AI-genererade illustrationer som gör lärandet visuellt</li>
          <li>Resursbibliotek för sparade förklaringar</li>
          <li>Facit-funktion så föräldern kan verifiera svar</li>
        </ul>

        <h2>Vad kostar Föräldrahjälpen?</h2>
        <p>Grundversionen är gratis med 3 AI-frågor per dag. Plus kostar 29 kr/mån och ger 15 frågor per dag. Pro kostar 59 kr/mån med obegränsad användning och delning mellan föräldrar.</p>

        <h2>Vilka ämnen stöds?</h2>
        <p>Alla ämnen i den svenska grundskolan: matematik, svenska, engelska, NO (biologi, fysik, kemi), SO (historia, geografi, samhällskunskap, religion) och moderna språk. Anpassat för åk 1-9.</p>

        <h2>Varför behöver föräldrar läxhjälp?</h2>
        <p>Många föräldrar känner sig osäkra på att hjälpa med läxor, särskilt när kursplanen har ändrats sedan de själva gick i skolan. Föräldrahjälpen ger tryggheten att kunna stötta sitt barn pedagogiskt, oavsett egen utbildningsbakgrund.</p>

        <h2>Hur kopplas svaren till läroplanen?</h2>
        <p>Varje AI-svar avslutas med en koppling till Lgr22 — den svenska läroplanen. Du får veta vilket centralt innehåll som berörs, varför barnet lär sig detta, och vilken förmåga som tränas. Skrivet så att alla föräldrar förstår.</p>
