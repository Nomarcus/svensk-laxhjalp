        <h1>Föräldrahjälpen — AI-driven läxhjälp för svenska föräldrar</h1>
        <p>Föräldrahjälpen är en gratis AI-driven app som hjälper svenska föräldrar med barn i grundskolan (åk 1-9) att förstå och förklara läxor. Fota läxan med mobilen och få pedagogiska förklaringar kopplade till den svenska läroplanen Lgr22. Börja gratis idag.</p>

        <h2>Hur fungerar Föräldrahjälpen med AI?</h2>
        <p>Skriv en fråga eller fota en läxa — AI:n förklarar uppgiften steg för steg, anpassat efter barnets årskurs. Alla förklaringar kopplas till Lgr22 så du som förälder förstår varför barnet lär sig just detta.</p>

        <h3>Steg 1: Ställ en fråga eller fota läxan</h3>
        <p>Skriv frågan i chatten eller ta en bild med mobilen. AI:n förstår både text och bilder — allt från mattetal och ekvationer till uppsatser och NO-experiment. Fotografera arbetsblad, stenciler eller bokuppgifter direkt i appen.</p>

        <h3>Steg 2: Få en pedagogisk förklaring</h3>
        <p>AI:n (Google Gemini) förklarar steg för steg, anpassat efter barnets årskurs i grundskolan. Varje svar kopplas till det centrala innehållet i Lgr22 så du vet att informationen stämmer med vad skolan lär ut. Förklaringarna hjälper dig som förälder att vägleda barnet.</p>

        <h3>Steg 3: Planera och följ upp</h3>
        <p>Lägg till läxor i veckokalendern med inlämningsdagar och arbetsdagar. Se vad som ska göras varje dag. Dela planeringen med en annan förälder för att hålla båda uppdaterade — perfekt för separerade föräldrar med växelvis boende.</p>

        <h2>Vilka funktioner ingår i Föräldrahjälpen?</h2>
        <ul>
          <li>AI-assistent som förklarar alla skolämnen pedagogiskt och kopplar till Lgr22</li>
          <li>Fota läxan med mobilen och få den analyserad med bildanalys</li>
          <li>Veckoplanering med kalender, deadlines, inlämningsdagar och arbetsdagar</li>
          <li>Dela läxplaneringen och kalendern mellan föräldrar</li>
          <li>AI-genererade pedagogiska illustrationer som gör lärandet visuellt</li>
          <li>Resursbibliotek för att spara bra förklaringar och bygga en kunskapsbank</li>
          <li>Facit-funktion så föräldern kan verifiera svar och kontrollera att barnet löst rätt</li>
          <li>PWA-app som installeras på mobil, surfplatta och dator</li>
        </ul>

        <h2>Vilka ämnen stöds i alla årskurser?</h2>
        <h3>Matematik</h3>
        <p>Hjälp med addition, subtraktion, multiplikation, division, bråktal, decimaltal, ekvationer, geometri, algebra, procent, sannolikhet och statistik. Anpassat från enkel addition i åk 1 till avancerade ekvationer i åk 9.</p>
        <h3>Svenska och engelska</h3>
        <p>Stöd med grammatik, stavning, läsförståelse, uppsatsskrivning, textanalys, glosor, meningsbyggnad och ordförråd. AI:n kan förklara grammatikregler och hjälpa med textuppgifter.</p>
        <h3>NO — naturorienterande ämnen</h3>
        <p>Biologi (kroppen, ekologi, cellen), fysik (kraft, energi, elektricitet), kemi (grundämnen, kemiska reaktioner, syror och baser) och teknik. Pedagogiska förklaringar av naturvetenskapliga fenomen.</p>
        <h3>SO — samhällsorienterande ämnen</h3>
        <p>Historia (forntiden, medeltiden, moderna tiden), geografi (kartor, klimat, världsdelar), samhällskunskap (demokrati, rättigheter, ekonomi) och religion (världsreligioner, etik, livsfrågor).</p>
        <h3>Moderna språk och övriga ämnen</h3>
        <p>Spanska, tyska, franska och andra moderna språk. Även stöd i bild, musik, slöjd och idrottsteori. AI:n anpassar sig efter det ämne du frågar om.</p>

        <h2>Vad kostar Föräldrahjälpen?</h2>
        <h3>Gratis — 0 kr för alltid</h3>
        <p>3 AI-frågor per dag, 1 bildanalys per dag, 1 AI-illustration per dag. Full tillgång till läxplanering och kalender. Koppling till läroplanen Lgr22. Perfekt för att testa appen.</p>
        <h3>Plus — 29 kr per månad (249 kr per år)</h3>
        <p>15 AI-frågor per dag, 5 bildanalyser per dag, 2 AI-illustrationer per dag. Tillgång till resursbiblioteket och facit-funktionen. Spara 28% med årsbetalning.</p>
        <h3>Pro — 59 kr per månad (499 kr per år)</h3>
        <p>Obegränsade AI-frågor och bildanalyser, 5 AI-illustrationer per dag. Dela kalender och planering med föräldrar. Prioriterad svarstid. Bäst för familjer med flera barn eller separerade föräldrar.</p>

        <h2>Varför behöver föräldrar läxhjälp?</h2>
        <p>Många föräldrar känner sig osäkra på att hjälpa med läxor, särskilt när kursplanen har ändrats sedan de själva gick i skolan. Läroplanen Lgr22 introducerade nya metoder och nytt centralt innehåll. Föräldrahjälpen ger tryggheten att kunna stötta sitt barn pedagogiskt, oavsett egen utbildningsbakgrund.</p>

        <h3>Ny läroplan och nya metoder</h3>
        <p>Tallinjer, areamodeller och positionssystem — matematikmetoderna har förändrats. Med Föräldrahjälpen kan du snabbt förstå hur barnet förväntas lösa uppgiften och förklara det på rätt sätt enligt dagens undervisning.</p>

        <h3>Perfekt för separerade föräldrar</h3>
        <p>Med delad kalender kan båda föräldrarna ha koll på läxor och deadlines, oavsett var barnet bor den veckan. All information synkas i realtid mellan föräldrarna.</p>

        <h2>Hur kopplas svaren till läroplanen Lgr22?</h2>
        <p>Varje AI-svar avslutas med en koppling till Lgr22 — den svenska läroplanen för grundskolan. Du får veta vilket centralt innehåll som berörs, vilken förmåga som tränas (analysförmåga, kommunikationsförmåga etc.), och varför barnet lär sig just detta ämne. Allt skrivet på ett sätt som alla föräldrar förstår, oavsett utbildningsbakgrund.</p>

        <h2>Vanliga frågor om Föräldrahjälpen</h2>
        <h3>Är Föräldrahjälpen fusk?</h3>
        <p>Nej. Appen hjälper föräldern att förstå uppgiften och vägleda barnet. AI:n ger pedagogiska förklaringar steg för steg, inte färdiga svar. Målet är att bygga förståelse tillsammans med barnet.</p>
        <h3>Fungerar appen på mobil?</h3>
        <p>Ja, Föräldrahjälpen är en PWA (Progressive Web App) som fungerar på iPhone, Android, iPad, Windows och Mac. Installera den direkt på hemskärmen utan att ladda ner från App Store eller Google Play.</p>
        <h3>Kan jag dela med en annan förälder?</h3>
        <p>Ja, med Pro-abonnemanget kan du dela barnets kalender och planering med en annan förälder. Alla ändringar synkas i realtid. Perfekt för växelvis boende och separerade föräldrar.</p>
        <h3>Vilka årskurser stöds?</h3>
        <p>Alla årskurser i grundskolan, från åk 1 till åk 9. AI:n anpassar språket, svårighetsgraden och läroplanskopplingen efter barnets årskurs.</p>
